<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57534e"/>
    </marker>
    <style>
      .zone { fill: #faf9f6; stroke: #e7e3dc; stroke-width: 1.5; }
      .zone-title { font-size: 15px; font-weight: 700; fill: #1c1917; letter-spacing: .02em; }
      .box { fill: #ffffff; stroke: #d6d0c6; stroke-width: 1.2; }
      .key { fill: #f7e9e3; stroke: #b8492f; stroke-width: 1.2; }
      .chain { fill: #eef6f0; stroke: #9cc7aa; stroke-width: 1.2; }
      .title { font-size: 14px; font-weight: 650; fill: #1c1917; }
      .body { font-size: 12px; fill: #57534e; }
      .label { font-size: 11.5px; fill: #44403c; }
      .line { stroke: #57534e; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 5 4; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f6f5f1"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#1c1917">Sealed architecture</text>
  <text x="40" y="68" font-size="13" fill="#6b645c">Private stablecoin payroll on Solana Confidential Balances. Amounts are encrypted on-chain; keys stay with their owners.</text>

  <!-- Browser -->
  <rect class="zone" x="40" y="92" width="1120" height="200" rx="14"/>
  <text class="zone-title" x="60" y="118">BROWSER</text>

  <rect class="box" x="60" y="132" width="340" height="144" rx="10"/>
  <text class="title" x="76" y="156">Employee portal</text>
  <text class="body" x="76" y="178">• Keys derived from one wallet signature</text>
  <text class="body" x="76" y="196">• Builds setup / collect / withdraw txs,</text>
  <text class="body" x="88" y="212">proofs generated locally (WASM)</text>
  <text class="body" x="76" y="230">• Decrypts balances and pay history</text>
  <text class="body" x="76" y="248">• Never needs SOL</text>
  <rect class="key" x="262" y="240" width="126" height="26" rx="6"/>
  <text class="label" x="274" y="257">ElGamal + AES keys</text>

  <rect class="box" x="430" y="132" width="340" height="144" rx="10"/>
  <text class="title" x="446" y="156">Company dashboard</text>
  <text class="body" x="446" y="178">• Treasury, team, invite links</text>
  <text class="body" x="446" y="196">• Review a payroll run, approve it by</text>
  <text class="body" x="458" y="212">signing with the admin wallet</text>
  <text class="body" x="446" y="230">• Live progress, run history</text>

  <rect class="box" x="800" y="132" width="340" height="144" rx="10"/>
  <text class="title" x="816" y="156">Accountant view</text>
  <text class="body" x="816" y="178">• Auditor key file loaded locally</text>
  <text class="body" x="816" y="196">• Reads transfers straight from the chain</text>
  <text class="body" x="816" y="214">• Decrypts every amount, exports CSV</text>
  <rect class="key" x="1016" y="240" width="112" height="26" rx="6"/>
  <text class="label" x="1030" y="257">Auditor secret key</text>

  <!-- Server -->
  <rect class="zone" x="40" y="330" width="1120" height="186" rx="14"/>
  <text class="zone-title" x="60" y="356">SEALED SERVER (Next.js)</text>

  <rect class="box" x="60" y="370" width="340" height="130" rx="10"/>
  <text class="title" x="76" y="394">Fee sponsor</text>
  <text class="body" x="76" y="416">• Checks each employee tx against a strict</text>
  <text class="body" x="88" y="432">policy, then co-signs as fee payer</text>
  <text class="body" x="76" y="450">• Own token account only, rent capped,</text>
  <text class="body" x="88" y="466">proof rent returns to the company</text>
  <text class="body" x="76" y="484">• Rate-limited per employee</text>

  <rect class="box" x="430" y="370" width="340" height="130" rx="10"/>
  <text class="title" x="446" y="394">Payroll engine</text>
  <text class="body" x="446" y="416">• Generates transfer proofs (Node WASM)</text>
  <text class="body" x="446" y="434">• Pays one employee at a time from the</text>
  <text class="body" x="458" y="450">treasury, as a resumable job</text>
  <text class="body" x="446" y="468">• Balance check before any retry:</text>
  <text class="body" x="458" y="484">nobody is paid twice</text>
  <rect class="key" x="656" y="376" width="104" height="26" rx="6"/>
  <text class="label" x="667" y="393">Payroll Vault key</text>

  <rect class="box" x="800" y="370" width="340" height="130" rx="10"/>
  <text class="title" x="816" y="394">MongoDB</text>
  <text class="body" x="816" y="416">• Companies, members, invites, runs,</text>
  <text class="body" x="828" y="432">payment status and signatures</text>
  <text class="body" x="816" y="450">• Salaries and vault key encrypted at rest</text>
  <text class="body" x="816" y="468">• Never: employee signatures, derived</text>
  <text class="body" x="828" y="484">keys, the auditor secret</text>

  <!-- Chain -->
  <rect class="zone" x="40" y="554" width="1120" height="176" rx="14"/>
  <text class="zone-title" x="60" y="580">SOLANA</text>

  <rect class="chain" x="60" y="594" width="340" height="120" rx="10"/>
  <text class="title" x="76" y="618">Token-2022 Confidential Balances</text>
  <text class="body" x="76" y="640">• Company token: manual approval,</text>
  <text class="body" x="88" y="656">auditor key = the accountant's</text>
  <text class="body" x="76" y="674">• Encrypted balances and transfer amounts</text>
  <text class="body" x="76" y="692">• Public: addresses, that a payment happened</text>

  <rect class="chain" x="430" y="594" width="340" height="120" rx="10"/>
  <text class="title" x="446" y="618">ZK ElGamal Proof program</text>
  <text class="body" x="446" y="640">• Verifies equality, ciphertext-validity</text>
  <text class="body" x="458" y="656">and range proofs for every transfer</text>
  <text class="body" x="446" y="674">• Re-enabled on mainnet June 2026</text>

  <rect class="chain" x="800" y="594" width="340" height="120" rx="10" stroke-dasharray="6 4"/>
  <text class="title" x="816" y="618">Sealed Vault program (stretch)</text>
  <text class="body" x="816" y="640">• Wraps USDC 1:1 into each company's</text>
  <text class="body" x="828" y="656">confidential token, and back</text>
  <text class="body" x="816" y="674">• Invariant: supply == USDC held</text>

  <!-- Arrows -->
  <path class="line" d="M330 276 V366"/>
  <text class="label" x="340" y="310">partly signed tx</text>
  <text class="label" x="340" y="325">(owner + proofs)</text>
  <path class="line" d="M600 276 V366"/>
  <text class="label" x="610" y="316">signed approval</text>
  <path class="line" d="M970 276 V366"/>
  <text class="label" x="980" y="316">team directory</text>
  <path class="line" d="M330 500 V590"/>
  <text class="label" x="340" y="545">co-signed tx</text>
  <path class="line" d="M600 500 V590"/>
  <text class="label" x="610" y="545">confidential transfers</text>
  <path class="line dash" d="M1140 204 C1178 204 1178 250 1178 300 V540 C1178 548 1150 548 1100 552"/>
  <text class="label" x="1010" y="540">reads transfers from the chain</text>
</svg>
